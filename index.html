<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>SnapBrush Overlay</title>
  <style>
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
    body, html { width: 100vw; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; cursor: crosshair; }
    canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }

    .toolbar {
      position: absolute;
      display: none;
      background: rgba(24, 24, 30, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 4px 6px;
      gap: 4px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55);
      z-index: 20;
      align-items: center;
      backdrop-filter: blur(8px);
    }

    .tool-group {
      position: relative;
      display: flex;
      align-items: center;
    }

    .icon-btn {
      position: relative;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: #dcdce6;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.15s;
    }

    .icon-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .icon-btn.active { background: #0078d4; color: #fff; border-color: #3aa0f3; }
    .icon-btn.danger:hover { background: #e81123; color: #fff; }

    .corner-caret {
      position: absolute;
      right: 2px;
      bottom: 2px;
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-top: 4px solid transparent;
      border-right: 4px solid currentColor;
      border-bottom: 4px solid currentColor;
      opacity: 0.65;
    }
    .icon-btn:hover .corner-caret,
    .icon-btn.active .corner-caret {
      opacity: 1;
    }

    .submenu {
      position: absolute;
      left: 0;
      bottom: 36px;
      display: none;
      flex-direction: column;
      background: rgba(24, 24, 30, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 7px;
      padding: 4px;
      gap: 2px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
      z-index: 40;
      min-width: 145px;
    }
    .submenu.open-down {
      bottom: auto;
      top: 36px;
    }
    .submenu.show {
      display: flex;
    }

    .submenu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      background: transparent;
      color: #dcdce6;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
    }
    .submenu-item svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    .submenu-item:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
    .submenu-item.selected { background: #0078d4; color: #fff; }

    .divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.15);
      margin: 0 3px;
    }

    .size-control {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #23232c;
      padding: 0 8px;
      height: 30px;
      border-radius: 6px;
      border: 1px solid #383846;
    }

    .size-preview-box {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #sizeCircle {
      border-radius: 50%;
      background: #ff2e2e;
      transition: width 0.08s, height 0.08s, background 0.15s;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 65px;
      height: 4px;
      background: #48485a;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #3aa0f3;
      cursor: pointer;
    }

    .swatch {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      cursor: pointer;
      border: 1.5px solid rgba(255,255,255,0.25);
      transition: transform 0.12s;
    }
    .swatch:hover, .swatch.selected { transform: scale(1.2); border-color: #fff; }

    input[type="color"] {
      width: 22px;
      height: 22px;
      border: none;
      background: none;
      cursor: pointer;
      padding: 0;
    }

    #textInput {
      position: absolute;
      display: none;
      background: rgba(0, 0, 0, 0.55);
      border: 1px dashed #3aa0f3;
      border-radius: 4px;
      color: #ff2e2e;
      font: bold 20px 'Segoe UI', sans-serif;
      padding: 3px 6px;
      outline: none;
      z-index: 30;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <input type="text" id="textInput" placeholder="Digite o texto..." />

  <div id="drawToolbar" class="toolbar">
    <button class="icon-btn active" data-tool="pen" title="Caneta">
      <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
    </button>
    <button class="icon-btn" data-tool="brush" title="Pincel Macio">
      <svg viewBox="0 0 24 24"><path d="M18.37 2.63L14 7l-1.59-1.59a2 2 0 00-2.82 0L8 7l9 9 1.59-1.59a2 2 0 000-2.82L17 10l4.37-4.37a2.12 2.12 0 10-3-3z"/><path d="M9 8c-2 3-4 3.5-7 4l8 10c2-1 6-5 6-7"/></svg>
    </button>
    <button class="icon-btn" data-tool="highlighter" title="Marca-texto">
      <svg viewBox="0 0 24 24"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 01-2.8 0l-5.2-5.2a2 2 0 010-2.8L14 4"/></svg>
    </button>
    <button class="icon-btn" data-tool="eraser" title="Borracha (Apagar desenhos e textos)">
      <svg viewBox="0 0 24 24"><path d="M20 20H7L3 16C2 15 2 13 3 12L13 2L22 11L20 20Z"/><path d="M17 17L7 7"/></svg>
    </button>
    <button class="icon-btn" data-tool="line" title="Linha Reta">
      <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/></svg>
    </button>

    <!-- Botão de Seta -->
    <div class="tool-group">
      <button class="icon-btn" id="arrowBtn" title="Seta (Clique novamente ou botão direito para trocar formato)">
        <span id="arrowIconSlot">
          <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="10 5 19 5 19 14"/></svg>
        </span>
        <span class="corner-caret" data-caret="arrow"></span>
      </button>
      <div class="submenu" id="arrowMenu">
        <button class="submenu-item selected" data-variant="arrow-simple">
          <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="10 5 19 5 19 14"/></svg>
          Seta Simples
        </button>
        <button class="submenu-item" data-variant="arrow-double">
          <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="12 5 19 5 19 12"/><polyline points="12 19 5 19 5 12"/></svg>
          Seta Dupla
        </button>
        <button class="submenu-item" data-variant="arrow-dashed">
          <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5" stroke-dasharray="3 3"/><polyline points="10 5 19 5 19 14"/></svg>
          Seta Pontilhada
        </button>
        <button class="submenu-item" data-variant="arrow-curved">
          <svg viewBox="0 0 24 24"><path d="M5 19 Q 6 6 19 5"/><polyline points="12 4 19 5 17 12"/></svg>
          Seta Curva
        </button>
      </div>
    </div>

    <!-- Botão de Formas (Retângulos e Círculos) -->
    <div class="tool-group">
      <button class="icon-btn" id="rectBtn" title="Formas (Clique novamente ou botão direito para trocar formato)">
        <span id="rectIconSlot">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/></svg>
        </span>
        <span class="corner-caret" data-caret="rect"></span>
      </button>
      <div class="submenu" id="rectMenu">
        <button class="submenu-item selected" data-variant="rect-outline">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/></svg>
          Borda Retangular
        </button>
        <button class="submenu-item" data-variant="rect-rounded">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="5"/></svg>
          Borda Arredondada
        </button>
        <button class="submenu-item" data-variant="rect-filled">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" fill="currentColor" fill-opacity="0.45"/></svg>
          Retângulo Cheio
        </button>
        <button class="submenu-item" data-variant="circle-outline">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
          Borda Círculo
        </button>
        <button class="submenu-item" data-variant="circle-filled">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="currentColor" fill-opacity="0.45"/></svg>
          Círculo Cheio
        </button>
      </div>
    </div>

    <button class="icon-btn" data-tool="text" title="Texto (Arraste textos existentes para mover)">
      <svg viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
    </button>

    <div class="divider"></div>

    <div class="size-control" title="Espessura do traço / borracha (ou role o Scroll)">
      <div class="size-preview-box">
        <div id="sizeCircle"></div>
      </div>
      <input type="range" id="strokeSize" min="2" max="22" value="5" />
    </div>

    <div class="divider"></div>

    <div class="swatch selected" style="background:#ff2e2e" data-color="#ff2e2e"></div>
    <div class="swatch" style="background:#00e676" data-color="#00e676"></div>
    <div class="swatch" style="background:#ffeb3b" data-color="#ffeb3b"></div>
    <div class="swatch" style="background:#2979ff" data-color="#2979ff"></div>
    <div class="swatch" style="background:#ffffff" data-color="#ffffff"></div>
    <input type="color" id="colorPicker" value="#ff2e2e" title="Escolher Cor" />

    <div class="divider"></div>

    <button class="icon-btn" id="undoBtn" title="Desfazer (Ctrl+Z)">
      <svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/></svg>
    </button>
    <button class="icon-btn" id="copyBtn" title="Copiar (Ctrl+C)">
      <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
    </button>
    <button class="icon-btn" id="saveBtn" title="Salvar (Ctrl+S)">
      <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    </button>
    <button class="icon-btn danger" id="closeBtn" title="Cancelar (Esc)">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <script src="editor.js"></script>
</body>
</html>
